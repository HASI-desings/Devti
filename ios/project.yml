# Xcode project for the Devti iPhone and iPad companion, generated with XcodeGen:
#   ./build-core.sh && xcodegen generate && open Devti.xcodeproj
name: Devti
options:
  bundleIdPrefix: app.devti
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    # Set your own team in Xcode (Signing & Capabilities); a free Apple ID works for 7-day installs.
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: NO
targets:
  Devti:
    type: application
    platform: iOS
    sources:
      - path: Devti
      - path: Generated
        createIntermediateGroups: true
    dependencies:
      - framework: Frameworks/DevtiCore.xcframework
        embed: false
      - sdk: SystemConfiguration.framework
      - sdk: Security.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.devti.ios
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        OTHER_LDFLAGS: ["-lresolv"]
    info:
      path: Devti/Info.plist
      properties:
        CFBundleDisplayName: Devti
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UIUserInterfaceStyle: Dark
        UIAppFonts: [BricolageGrotesque.ttf, InstrumentSans.ttf]
        NSCameraUsageDescription: Devti uses the camera only to scan the pairing QR code your computer shows.
        NSLocalNetworkUsageDescription: Devti connects directly to your own computers on this network, encrypted.
        # Received files appear in the Files app under On My iPhone → Devti.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        CFBundleURLTypes:
          - CFBundleURLName: app.devti.pair
            CFBundleURLSchemes: [devti]
  DevtiTests:
    type: bundle.unit-test
    platform: iOS
    sources: [DevtiTests]
    dependencies:
      - target: Devti
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Devti:
    build:
      targets:
        Devti: all
        DevtiTests: [test]
    test:
      targets: [DevtiTests]
