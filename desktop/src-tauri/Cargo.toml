[package]
name = "devti-desktop"
description = "Devti Hub — the desktop app at the center of your device ecosystem"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
name = "devti_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
devti-core = { workspace = true, features = ["keychain"] }
tauri = { version = "2.12", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2.5"
tauri-plugin-autostart = "2.7"
tauri-plugin-opener = "2.7"
tauri-plugin-notification = "2.8"
tauri-plugin-dialog = "2.8"
arboard = { version = "3.7", default-features = false, features = ["wayland-data-control"] }
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender = "0.2"
anyhow.workspace = true
btleplug = "0.13"
futures.workspace = true
uuid = "1"
starship-battery = "0.12"
os_info = { version = "3.15", default-features = false }
gethostname = "1.1"

[features]
# Tauri uses this to switch between dev server and bundled assets.
custom-protocol = ["tauri/custom-protocol"]
