[package]
name = "devti-desktop"
description = "Devti Hub — the desktop app at the center of your device ecosystem"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
name = "devti_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
extism = { version = "1.41", default-features = false, features = ["http"] }
devti-core = { workspace = true, features = ["api", "keychain"] }
tauri = { version = "2.12", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2.5"
tauri-plugin-autostart = "2.7"
tauri-plugin-opener = "2.7"
tauri-plugin-notification = "2.8"
tauri-plugin-dialog = "2.8"
arboard = { version = "3.7", default-features = false, features = ["wayland-data-control"] }
tokio = { workspace = true, features = ["process"] }
# Pure-Rust keysym tables (used by the X11 edge-switching key translation and its tests).
xkeysym = "0.2"
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender = "0.2"
anyhow.workspace = true
btleplug = "0.13"
futures.workspace = true
uuid = "1"
starship-battery = "0.12"
os_info = { version = "3.15", default-features = false }
gethostname = "1.1"
enigo = { version = "0.6.1", features = ["wayland", "libei_tokio"] }
tokio-tungstenite = "0.29"
base64 = "0.22"
sha2 = "0.11"
parking_lot = "0.13"
xcap = "0.9.10"
jpeg-encoder = "0.6.1"
fast_image_resize = "5.1.4"
chrono = "0.4"
sysinfo = { version = "0.36", default-features = false, features = ["system"] }
zune-jpeg = "0.5"

[features]
# Tauri uses this to switch between dev server and bundled assets.
custom-protocol = ["tauri/custom-protocol"]

[target.'cfg(target_os = "linux")'.dependencies]
bluer = { version = "0.17.4", features = ["bluetoothd", "l2cap", "rfcomm"] }
libc = "0.2"
x11rb = "0.13"
zbus = "5"

[target."cfg(windows)".dependencies]
cpal = "0.18"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_LibraryLoader"] }
