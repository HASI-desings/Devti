[package]
name = "link-cleaner"
version = "1.0.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "Example Devti plugin: removes tracking parameters from copied links"
publish = false

# A standalone crate (built for wasm32-unknown-unknown), not part of Devti's workspace.
[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
extism-pdk = "1.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
strip = true
