[workspace]
resolver = "3"
members = ["core", "core/ffi", "desktop/src-tauri", "cli"]
default-members = ["core", "core/ffi", "cli"]

[workspace.package]
version = "1.0.2"
edition = "2024"
rust-version = "1.85"
license = "GPL-3.0-or-later"
repository = "https://github.com/hasi-desings/devti"
authors = ["Hussnain Sohail and Devti contributors"]

[workspace.dependencies]
devti-core = { path = "core" }
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util", "fs"] }
quinn = { version = "0.11.12", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "logging"] }
rcgen = { version = "0.14.10", default-features = false, features = ["ring", "crypto"] }
ring = "0.17.14"
spake2 = "0.4"
sha2 = "0.11"
hmac = "0.13"
hkdf = "0.13"
ciborium = "0.2.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_bytes = "0.11"
thiserror = "2"
anyhow = "1"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
mdns-sd = "0.22"
rusqlite = { version = "0.43", features = ["bundled"] }
data-encoding = "2.11"
getrandom = "0.4"
if-addrs = "0.15"
url = "2.5"
x509-parser = "0.18"
keyring = "4.2"
parking_lot = "0.13"
futures = "0.3"
bytes = "1"
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
