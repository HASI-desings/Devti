[package]
name = "devti-core"
description = "Devti Core: protocol, crypto, pairing, discovery and transport shared by every Devti platform"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
default = []
# OS keychain support (Windows Credential Manager / Secret Service / macOS Keychain).
keychain = ["dep:keyring"]
# Local HTTP + WebSocket API for scripts and the `devti` CLI (127.0.0.1 only, token auth).
api = ["dep:axum"]

[dependencies]
tokio.workspace = true
quinn.workspace = true
rustls.workspace = true
rcgen.workspace = true
ring.workspace = true
spake2.workspace = true
sha2.workspace = true
hmac.workspace = true
hkdf.workspace = true
ciborium.workspace = true
serde.workspace = true
serde_bytes.workspace = true
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio", "ws"], optional = true }
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
mdns-sd.workspace = true
rusqlite.workspace = true
data-encoding.workspace = true
getrandom.workspace = true
if-addrs.workspace = true
url.workspace = true
x509-parser.workspace = true
parking_lot.workspace = true
futures.workspace = true
bytes.workspace = true
keyring = { workspace = true, optional = true }
serde_yaml_ng = "0.10"
crc = "3.4"

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }
tracing-subscriber.workspace = true
