name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  core:
    name: Core · fmt, clippy, test, coverage
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy, llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy -p devti-core -p devti-ffi -p devti-cli --all-targets -- -D warnings
      - name: Test with coverage (fails under 80 % lines)
        run: cargo llvm-cov -p devti-core -p devti-ffi -p devti-cli --fail-under-lines 80 --summary-only
      - name: Coverage report
        run: cargo llvm-cov report -p devti-core --lcov --output-path lcov.info
      - uses: actions/upload-artifact@v5
        with:
          name: core-coverage-lcov
          path: lcov.info

  core-windows:
    name: Core · tests on Windows
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p devti-core -p devti-ffi -p devti-cli

  fuzz-smoke:
    name: Fuzz · 60 s per target
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core/fuzz
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      - name: Fuzz
        working-directory: core
        run: |
          for t in protocol_messages pairing_uri frame_stream accessory_frames; do
            cargo +nightly fuzz run --target x86_64-unknown-linux-gnu "$t" -- -max_total_time=60
          done
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: fuzz-crashes
          path: core/fuzz/artifacts

  desktop:
    name: Desktop · ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            bundles: deb,rpm,appimage
          - os: windows-2025
            bundles: nsis,msi
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v5
      - name: Linux system libraries
        if: runner.os == 'Linux'
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libsoup-3.0-dev libdbus-1-dev libxkbcommon-dev libpipewire-0.3-dev libspa-0.2-dev \
            libclang-dev libgbm-dev libegl-dev xvfb xdotool webkit2gtk-driver rpm
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Type-check
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm test
      - name: UI tests (Playwright)
        if: runner.os == 'Linux'
        run: |
          pnpm exec playwright install --with-deps chromium
          pnpm test:e2e --trace off
      - name: Example plugin (unit tests + WebAssembly build)
        working-directory: plugins/link-cleaner
        run: |
          cargo test
          cargo build --release --target wasm32-unknown-unknown
      - name: Rust tests (the plugin host runs the example plugin in its sandbox)
        env:
          DEVTI_TEST_PLUGIN: ${{ github.workspace }}/plugins/link-cleaner/target/wasm32-unknown-unknown/release/link_cleaner.wasm
        run: cargo test -p devti-desktop
      - name: Real-app smoke test (WebKitGTK + core + simulated phone)
        if: runner.os == 'Linux'
        run: |
          cargo install tauri-driver --locked
          pnpm tauri build --debug --no-bundle
          cargo build -p devti-core --example sim_device
          WEBKIT_DISABLE_DMABUF_RENDERER=1 xvfb-run -a -s "-screen 0 1440x900x24" \
            node tests/real/smoke.mjs ../target/debug/devti-desktop ../target/debug/examples/sim_device smoke-shots
      - uses: actions/upload-artifact@v5
        if: always() && runner.os == 'Linux'
        with:
          name: real-app-screenshots
          path: desktop/smoke-shots
          if-no-files-found: ignore
      - name: Build the devti CLI (packaged into the Linux installers, shipped beside the Windows ones)
        run: cargo build --release -p devti-cli
      - name: Build installers
        run: pnpm tauri build --bundles ${{ matrix.bundles }}
      - uses: actions/upload-artifact@v5
        with:
          name: devti-desktop-${{ runner.os }}
          path: |
            target/release/bundle/**/*.deb
            target/release/bundle/**/*.rpm
            target/release/bundle/**/*.AppImage
            target/release/bundle/**/*.exe
            target/release/bundle/**/*.msi
            target/release/devti.exe
          if-no-files-found: error

  android-bindings:
    name: Android · Kotlin bindings vs real core (JVM)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: gradle/actions/setup-gradle@v4
      - name: Pair two nodes through the generated Kotlin API
        working-directory: android
        run: ./gradlew --no-daemon -p jvm-check test

  android:
    name: Android · APK
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests and release APK
        working-directory: android
        run: |
          export ANDROID_NDK_HOME="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_ROOT}"
          echo "Using NDK at $ANDROID_NDK_HOME"
          # assembleDebug creates the debug keystore that sideload release builds are signed
          # with when no DEVTI_KEYSTORE secret is configured.
          ./gradlew --no-daemon testDebugUnitTest assembleDebug assembleRelease
      - uses: actions/upload-artifact@v5
        with:
          name: devti-android-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

  ios:
    name: iOS · Swift app on the simulator (build + tests)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@v2
      - name: Devti Core for the simulator + Swift bindings
        run: ios/build-core.sh sim debug
      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          cd ios && xcodegen generate
      - name: Build and test on an iPhone simulator (the tests drive the real core)
        run: |
          set -o pipefail
          DEVICE=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for k,v in sorted(d.items(), reverse=True) if 'iOS' in k for x in v if x['name'].startswith('iPhone')))")
          echo "Simulator: $DEVICE"
          cd ios && xcodebuild test -project Devti.xcodeproj -scheme Devti -destination "id=$DEVICE" CODE_SIGNING_ALLOWED=NO -quiet
