name: Release

# Builds every installer from a version tag and publishes them as a GitHub Release.
#   git tag v1.0.0 && git push origin v1.0.0
#   …or publish a release with a new v* tag on the GitHub website.
on:
  push:
    tags: ["v*"]
  release:
    types: [published]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  desktop:
    name: Installers · ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            bundles: deb,rpm,appimage
          - os: windows-2025
            bundles: nsis,msi
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v5
      - name: Linux system libraries
        if: runner.os == 'Linux'
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libsoup-3.0-dev libdbus-1-dev libxkbcommon-dev libpipewire-0.3-dev libspa-0.2-dev \
            libclang-dev libgbm-dev libegl-dev rpm
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile
      - name: The devti command-line tool
        run: cargo build --release -p devti-cli
      - name: Installers
        run: pnpm tauri build --bundles ${{ matrix.bundles }}
      - name: Collect
        shell: bash
        working-directory: .
        run: |
          mkdir -p dist
          find target/release/bundle -type f \( -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' -o -name '*.exe' -o -name '*.msi' \) -exec cp {} dist/ \;
          if [ -f target/release/devti.exe ]; then cp target/release/devti.exe "dist/devti-cli-${GITHUB_REF_NAME}-windows-x64.exe"; fi
          ls -la dist
      - uses: actions/upload-artifact@v5
        with:
          name: release-desktop-${{ runner.os }}
          path: dist/*
          if-no-files-found: error

  android:
    name: Android APK
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk
      - uses: gradle/actions/setup-gradle@v4
      - name: Release APK
        working-directory: android
        env:
          KEYSTORE_B64: ${{ secrets.DEVTI_KEYSTORE_B64 }}
          DEVTI_KEYSTORE_PASSWORD: ${{ secrets.DEVTI_KEYSTORE_PASSWORD }}
          DEVTI_KEY_ALIAS: ${{ secrets.DEVTI_KEY_ALIAS }}
          DEVTI_KEY_PASSWORD: ${{ secrets.DEVTI_KEY_PASSWORD }}
        run: |
          export ANDROID_NDK_HOME="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_ROOT}"
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/devti.jks"
            export DEVTI_KEYSTORE="$RUNNER_TEMP/devti.jks"
            echo "Signing with the Devti release key"
          else
            echo "::warning::No DEVTI_KEYSTORE_B64 secret: the APK is signed with a debug key (see docs/RELEASING.md)"
          fi
          ./gradlew --no-daemon assembleDebug assembleRelease
          mkdir -p ../dist
          cp app/build/outputs/apk/release/*.apk "../dist/devti-${GITHUB_REF_NAME}-android.apk"
      - uses: actions/upload-artifact@v5
        with:
          name: release-android
          path: dist/*
          if-no-files-found: error

  plugin:
    name: Example plugin
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Build and package Link cleaner
        working-directory: plugins/link-cleaner
        run: |
          cargo test
          cargo build --release --target wasm32-unknown-unknown
          mkdir -p pkg/link-cleaner ../../dist
          cp devti-plugin.json pkg/link-cleaner/
          cp target/wasm32-unknown-unknown/release/link_cleaner.wasm pkg/link-cleaner/plugin.wasm
          (cd pkg && zip -r "../../../dist/devti-plugin-link-cleaner-${GITHUB_REF_NAME}.zip" link-cleaner)
      - uses: actions/upload-artifact@v5
        with:
          name: release-plugin
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish the release
    needs: [desktop, android, plugin]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          name: Devti ${{ github.ref_name }}
          body_path: docs/release-notes/${{ github.ref_name }}.md
          files: dist/*
          fail_on_unmatched_files: true
